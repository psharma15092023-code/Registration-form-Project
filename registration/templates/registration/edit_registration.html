<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #eef2f7;
        color: #333;
    }

    /* Main page */
    .main {
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Form container */
    .container {
        width: 100%;
        max-width: 1100px;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        overflow: hidden;
    }

    /* Heading */
    h2 {
        margin: 0;
        padding: 20px 30px;
        background: linear-gradient(135deg, #1f6f8b, #2fa4dc);
        color: white;
        font-size: 24px;
        font-weight: 600;
        text-align: left;
    }

    /* Form */
    form {
        padding: 30px;
    }

    /* Form row */
    .row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
    }

    .row > div {
        width: 100%;
    }

    /* Labels */
    label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #374151;
    }

    /* Inputs and Select */
    input,
    select {
        width: 100%;
        height: 44px;
        padding: 10px 13px;
        margin: 0;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #ffffff;
        color: #333;
        font-size: 14px;
        outline: none;
        transition: all 0.2s ease;
    }

    
    input:focus,
    select:focus {
        border-color: #2fa4dc;
        box-shadow: 0 0 0 3px rgba(47, 164, 220, 0.15);
    }

    
    input::placeholder {
        color: #9ca3af;
    }

    
    select {
        cursor: pointer;
    }

    
    .row > div:last-child {
        display: flex;
        align-items: end;
    }

    
    button {
        width: 100%;
        height: 44px;
        padding: 0 20px;
        margin: 0;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #2fa4dc, #1f6f8b);
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(31, 111, 139, 0.25);
    }

    button:active {
        transform: translateY(0);
    }

    
    @media (max-width: 900px) {
        .row {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    
    @media (max-width: 600px) {
        .main {
            padding: 20px 12px;
            align-items: flex-start;
        }

        .container {
            border-radius: 10px;
        }

        h2 {
            padding: 18px 20px;
            font-size: 20px;
        }

        form {
            padding: 20px;
        }

        .row {
            grid-template-columns: 1fr;
            gap: 18px;
        }

        button {
            margin-top: 5px;
        }
    }
</style>
<body>
    <div class="main">
        <div class="container">
            <h2>Edit Registration Form</h2>
            <form action="{% url 'edit_registration_item' registration.id %}" method="post">
              {% csrf_token %}

                <div class="row">

                    <div>
                        <label>First Name</label>
                            <input type="text" name="Firstname" value="{{ registration.Firstname }}" required>
                    </div>

                    <div>
                        <label>Last Name</label>
                        <input type="text" name="Lastname" value="{{ registration.Lastname }}" required>
                    </div>

                    <div>
                        <label>Email Address</label>
                        <input type="email" name="EmailAddress" value="{{ registration.EmailAddress }}" required>
                    </div>

                    <div>
                        <label>Phone</label>
                        <input type="tel" name="Phone" value="{{ registration.Phone }}" maxlength="10"
                                pattern="[0-9]{10}"
                                title="Enter 10 digit mobile number"
                                required>
                    </div>

                    <div>
                    <label>City</label>
                    <select name="City">

                        <option {% if registration.City == "Delhi" %}selected{% endif %}>
                            Delhi
                        </option>

                        <option {% if registration.City == "Mumbai" %}selected{% endif %}>
                            Mumbai
                        </option>

                        <option {% if registration.City == "London" %}selected{% endif %}>
                            London
                        </option>

                        <option {% if registration.City == "Gujrat" %}selected{% endif %}>
                            Gujrat
                        </option>

                    </select>
                    </div>

                    <div>
                    <label>Country</label>
                    <select name="Country">

                        <option {% if registration.Country == "India" %}selected{% endif %}>
                            India
                        </option>

                        <option {% if registration.Country == "USA" %}selected{% endif %}>
                            USA
                        </option>

                        <option {% if registration.Country == "UK" %}selected{% endif %}>
                            UK
                        </option>

                    </select>
                </div>

            <div>
            <button type="submit">Update</button>
        </div>

    </div>
</form>
</div>
</div>

</body>
